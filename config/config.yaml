# ============================================================
# jobbot 主配置
# 修改本文件即可调整 平台 / 地区 / 数量，无需改代码。
# 默认只读：plan 不会发送消息；apply/run 必须显式 --yes。
# ============================================================

profile: config/profile.yaml

storage:
  db: data/jobbot.sqlite3
  plans_dir: data/plans
  reports_dir: data/reports
  debug_dir: data/debug

defaults:
  limit_per_run: 3          # 每次运行最多投递数（可被平台配置覆盖）
  limit_per_day: 3          # 每日最多投递数
  min_score: 60             # 低于该分数不进计划
  min_interval_seconds: 20  # 两条发送之间的最小随机间隔
  max_interval_seconds: 45
  headless: false           # 默认有头，便于观察与人工接管
  page_timeout_seconds: 30

search:
  keywords:
    - Java
    - Java 后端
    - Spring Boot
  exclude_keywords:
    - 销售
    - 保险
    - 房产中介
    - 培训讲师
    - 教育
    - 实习
    - 在校
    - 应届
    # - 对日
    # - 猎头
  salary_range_k: [13, 26]
  max_pages: 5
  job_types:
    - 全职

ai:
  enabled: true
  provider: local                         # local（Ollama）| online（OpenAI 兼容）
  fallback: null                          # 在线默认关闭，不回退；启用 online 后可改为 online
  max_greeting_chars: 120
  use_for_scoring: false                  # 本地评分已验证可完成（单条约 8 分钟）；默认只用 AI 写招呼语。
                                          # 需要 AI 精排：改 true（thinking_budget=2048、timeout_seconds=900 已配好）

  providers:
    local:
      enabled: true                       # 默认开
      type: ollama
      base_url: http://127.0.0.1:11434
      model: deepseek-r1:8b
      api_key_env: ""                     # Ollama 无需 Key
      timeout_seconds: 900                # 评分/思考较慢，留足时间
      keep_alive: 5m
      num_ctx: 6144
      thinking_budget: 2048               # R1 先输出思考内容，为最终答案预留 token
      think: false

    online:
      enabled: false                      # 默认关；临时用 --ai online，或改 true
      type: openai
      base_url: https://api.openai.com/v1 # 也可换成 DeepSeek / 通义等兼容地址
      model: gpt-4o-mini
      api_key_env: OPENAI_API_KEY
      timeout_seconds: 60

platforms:
  boss:
    enabled: true
    cities:                             # 目标.md：大连、北京
      - name: 大连
        code: "101070200"
      - name: 北京
        code: "101010100"
    limit_per_run: 3                    # 目标.md：数量 3
    limit_per_day: 3
    selectors: config/selectors.boss.yaml
    user_data_dir: data/browser/boss
    locale: zh-CN

  # 预留：实现适配器后把 enabled 改为 true
